name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: us-central1
  ARTIFACT_REPO: osiris-images
  # GCP_PROJECT_ID is read from repo/org secrets/vars in each job.

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Smoke tests
        run: python backend/smoke_test.py

      - name: Endpoint tests
        run: python backend/test_endpoints.py

  deploy:
    name: Build & deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push backend image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ env.ARTIFACT_REPO }}/backend"
          docker build -f Dockerfile.backend -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Build and push frontend image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ env.ARTIFACT_REPO }}/frontend"
          docker build -f Dockerfile.frontend -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy backend to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy osiris-backend \
            --image="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ env.ARTIFACT_REPO }}/backend:$GITHUB_SHA" \
            --region="${{ env.REGION }}" --platform=managed \
            --allow-unauthenticated \
            --timeout=600 --memory=1Gi --cpu=1 \
            --service-account=osiris-backend-sa@$GCP_PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=GOOGLE_SERVICE_ACCOUNT_FILE=/app/credentials/osiris-sa.json,GOOGLE_OAUTH_TOKEN_FILE=,SUPERADMIN_USERNAME=admin \
            --set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,SUPERADMIN_PASSWORD=superadmin-password:latest,DATABASE_URL=database-url:latest,GOOGLE_SERVICE_ACCOUNT_JSON=gdoc-sa-key:latest

      - name: Capture backend URL
        id: backend-url
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe osiris-backend --region="${{ env.REGION }}" --format='value(status.url)')
          echo "BACKEND_URL=$URL" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy osiris-frontend \
            --image="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ env.ARTIFACT_REPO }}/frontend:$GITHUB_SHA" \
            --region="${{ env.REGION }}" --platform=managed \
            --allow-unauthenticated \
            --timeout=600 --memory=1Gi --cpu=1 \
            --set-env-vars=BACKEND_URL=${{ env.BACKEND_URL }}

      - name: Point backend CORS at the frontend URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          FRONTEND_URL=$(gcloud run services describe osiris-frontend --region="${{ env.REGION }}" --format='value(status.url)')
          gcloud run services update osiris-backend \
            --region="${{ env.REGION }}" \
            --set-env-vars=GOOGLE_SERVICE_ACCOUNT_FILE=/app/credentials/osiris-sa.json,GOOGLE_OAUTH_TOKEN_FILE=,SUPERADMIN_USERNAME=admin,CORS_ORIGINS="$FRONTEND_URL"

      - name: Smoke test deployed services
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          BACKEND=$(gcloud run services describe osiris-backend --region="${{ env.REGION }}" --format='value(status.url)')
          FRONTEND=$(gcloud run services describe osiris-frontend --region="${{ env.REGION }}" --format='value(status.url)')
          echo "Backend : $BACKEND"
          echo "Frontend: $FRONTEND"
          echo "BACKEND_URL=$BACKEND" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=$FRONTEND" >> "$GITHUB_ENV"
          curl -fsS --retry 5 --retry-connrefused --max-time 90 "$BACKEND/api/health" | tee /tmp/health.json
          curl -fsS --retry 5 --retry-connrefused --max-time 90 -o /dev/null "$FRONTEND/"
          echo "HEALTH_OK"
