# cloudbuild.yaml - OSIRIS Imhotep
# ------------------------------------------------------------------
# Pipeline (4 phases, runs end-to-end on every push to main):
#   Phase 1: Build backend image  + push to Artifact Registry
#   Phase 2: Build frontend image + push to Artifact Registry
#   Phase 3: Deploy backend to Cloud Run
#   Phase 4: Deploy frontend to Cloud Run
# ------------------------------------------------------------------
# Substitutions (set in Cloud Build trigger or override with --substitutions):
#   _REGION       = Artifact Registry / Cloud Run region (e.g. us-central1)
#   _REPO         = Artifact Registry repo name (e.g. osiris)
#   _BACKEND_SRV  = Backend Cloud Run service name
#   _FRONTEND_SRV = Frontend Cloud Run service name
#   _ALLOWED_ORIG = Comma-separated CORS origins for backend
#   _DATABASE_URL = Neon / Cloud SQL connection string
#   _JWT_SECRET   = JWT signing secret (use Secret Manager for prod)
# ------------------------------------------------------------------
substitutions:
  _REGION: us-central1
  _REPO: osiris
  _BACKEND_SRV: osiris-backend
  _FRONTEND_SRV: osiris-frontend
  _ALLOWED_ORIG: "*"
  _DATABASE_URL: ""
  _JWT_SECRET: ""

steps:
  # ── Step 0: Build backend image ───────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:${SHORT_SHA}"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest"
      - "--cache-from"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest"
      - "."
    env:
      - "DOCKER_BUILDKIT=1"

  # ── Step 1: Build frontend image ─────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:${SHORT_SHA}"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:latest"
      - "--cache-from"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:latest"
      - "./frontend"
    env:
      - "DOCKER_BUILDKIT=1"

  # ── Step 2: Push backend ─────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend"
    waitFor: ["build-backend"]

  # ── Step 3: Push frontend ────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args:
      - "push"
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend"
    waitFor: ["build-frontend"]

  # ── Step 4: Deploy backend to Cloud Run ──────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-backend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_BACKEND_SRV}"
      - "--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=300"
      - "--concurrency=10"
      - "--set-env-vars=ALLOWED_ORIGINS=${_ALLOWED_ORIG},USE_CLOUD_SQL=0"
    secretEnv: ["DATABASE_URL", "JWT_SECRET"]
    waitFor: ["push-backend"]

  # ── Step 5: Deploy frontend to Cloud Run ─────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-frontend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SRV}"
      - "--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=3000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=60"
      - "--concurrency=80"
      - "--set-env-vars=NEXT_PUBLIC_BACKEND_URL=https://${_BACKEND_SRV}-${PROJECT_ID}.a.run.app,BACKEND_URL=https://${_BACKEND_SRV}-${PROJECT_ID}.a.run.app"
    waitFor: ["deploy-backend"]

# Store images in Artifact Registry
images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:${SHORT_SHA}"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:${SHORT_SHA}"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/frontend:latest"

# Build performance
options:
  machineType: "E2_HIGHCPU_8"
  logging: "CLOUD_LOGGING_ONLY"

# Secrets pulled from Secret Manager at deploy time.
# Required in Cloud Build trigger:
#   - DATABASE_URL
#   - JWT_SECRET
availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest"
      env: "DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/JWT_SECRET/versions/latest"
      env: "JWT_SECRET"
