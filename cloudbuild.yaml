# Minimal build config - NO secret substitutions (avoids the stale-trigger
# `_DATABASE_URL`/`_JWT_SECRET` rejection). Builds + pushes both images.
# Pass --substitutions=_TAG=<git short sha> (gcloud can't derive SHORT_SHA
# when .git/ is excluded from the upload).
#
# Trigger: osiris-imhotep-main (GitHub push to main, build-config=this file)
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "--no-cache"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:latest"
      - "-f"
      - "Dockerfile.backend"
      - "."

  # Build frontend using the live backend URL captured by get-backend-url.
  # NOTE: next.config.js rewrites() and the standalone server's BACKEND_URL
  # are read at build time, so the URL MUST be correct when this step runs.
  # Backend → Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "--all-tags"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep"

  # Deploy backend to Cloud Run (asia-east2)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-backend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "osiris-imhotep"
      - "--project=$PROJECT_ID"
      - "--region=asia-east2"
      - "--image=asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
      - "--allow-unauthenticated"
      - "--max-instances=3"
      - "--min-instances=1"
      - "--timeout=300"
      - "--cpu=1"
      - "--memory=1Gi"
      - "--service-account=824525498687-compute@developer.gserviceaccount.com"
      - "--set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,SUPERADMIN_PASSWORD=superadmin-password:latest,DATABASE_URL=database-url:latest,GOOGLE_SERVICE_ACCOUNT_JSON=gdoc-sa-key:latest"
      - "--set-env-vars=GOOGLE_SERVICE_ACCOUNT_FILE=/tmp/app-data/osiris-sa.json,RAG_PROVIDER=sqlite_vec"
      - "--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=osiris-imhotep-main"
      - "--quiet"

  # Capture the live backend URL to /workspace/.backend-url so the frontend
  # build can use it as a build-arg. This is the key step that keeps the
  # frontend in sync with the backend across redeploys.
  #
  # Uses the compute SA (which has roles/run.admin) because the default
  # Cloud Build SA only has roles/cloudbuild.builds.builder and lacks
  # permission to call gcloud run services describe.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "get-backend-url"
    entrypoint: "bash"
    serviceAccount: "projects/osiris-imhotep-507623/serviceAccounts/824525498687-compute@developer.gserviceaccount.com"
    args:
      - "-c"
      - |
        set +e
        echo "=== get-backend-url: starting ==="
        echo "PROJECT_ID=$$PROJECT_ID"
        echo "BRANCH_NAME=$$BRANCH_NAME"
        echo "PWD=$$(pwd)"
        echo "ls -la /workspace 2>&1 || true"
        ls -la /workspace 2>&1 || true
        echo "=== running gcloud run services describe ==="
        BACKEND_URL=$$(gcloud run services describe osiris-imhotep \
          --project=$$PROJECT_ID --region=asia-east2 \
          --format='value(status.url)' 2>&1)
        echo "gcloud exit: $$?"
        echo "BACKEND_URL=[$$BACKEND_URL]"
        if [ -z "$$BACKEND_URL" ]; then
          echo "ERROR: failed to capture backend URL" >&2
          exit 1
        fi
        echo "$$BACKEND_URL" > /workspace/.backend-url
        echo "Wrote /workspace/.backend-url:"
        cat /workspace/.backend-url
        echo "=== get-backend-url: done ==="

  # Build frontend using the live backend URL captured above.
  # NOTE: next.config.js rewrites() and the standalone server's BACKEND_URL
  # are read at build time, so the URL MUST be correct when this step runs.
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== build-frontend: starting ==="
        echo "Reading /workspace/.backend-url:"
        cat /workspace/.backend-url
        BACKEND_URL=$$(cat /workspace/.backend-url)
        echo "BACKEND_URL=[$$BACKEND_URL]"
        echo "Building frontend with BACKEND_URL=$$BACKEND_URL"
        docker build \
          -t "asia-east2-docker.pkg.dev/$$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:$$_TAG" \
          -t "asia-east2-docker.pkg.dev/$$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:latest" \
          --build-arg "BACKEND_URL=$$BACKEND_URL" \
          --build-arg "NEXT_PUBLIC_BACKEND_URL=$$BACKEND_URL" \
          --build-arg "NEXT_PUBLIC_API_URL=$$BACKEND_URL" \
          -f frontend/Dockerfile .

  # Frontend → Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args:
      - "push"
      - "--all-tags"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend"

  # Deploy frontend to Cloud Run (asia-east2).
  # NOTE: BACKEND_URL is baked into the image at build time (see build-frontend
  # step) so it does not need to be set as a runtime env-var here.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-frontend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "osiris-frontend"
      - "--project=$PROJECT_ID"
      - "--region=asia-east2"
      - "--image=asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:${_TAG}"
      - "--allow-unauthenticated"
      - "--max-instances=3"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=osiris-imhotep-main"
      - "--quiet"

  # Set CORS_ORIGINS on the backend to allow the live frontend origin.
  # Runs after both services are deployed so the frontend URL is stable.
  # Uses the compute SA (roles/run.admin) for the same reason as get-backend-url.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "set-cors"
    entrypoint: "bash"
    serviceAccount: "projects/osiris-imhotep-507623/serviceAccounts/824525498687-compute@developer.gserviceaccount.com"
    args:
      - "-c"
      - |
        set -euo pipefail
        FRONTEND_URL=$$(gcloud run services describe osiris-frontend \
          --project=$$PROJECT_ID --region=asia-east2 \
          --format='value(status.url)')
        echo "Setting CORS_ORIGINS=$$FRONTEND_URL on osiris-imhotep"
        gcloud run services update osiris-imhotep \
          --project=$$PROJECT_ID --region=asia-east2 \
          --update-env-vars="CORS_ORIGINS=$$FRONTEND_URL" \
          --quiet

images:
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:latest"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:${_TAG}"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: "CLOUD_LOGGING_ONLY"

substitutions:
  _TAG: latest