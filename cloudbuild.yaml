# Minimal build config - NO secret substitutions (avoids the stale-trigger
# `_DATABASE_URL`/`_JWT_SECRET` rejection). Builds + pushes both images.
# Pass --substitutions=_TAG=<git short sha> (gcloud can't derive SHORT_SHA
# when .git/ is excluded from the upload).
#
# Trigger: osiris-imhotep-main (GitHub push to main, build-config=this file)
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "--no-cache"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:latest"
      - "-f"
      - "Dockerfile.backend"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:${_TAG}"
      - "-t"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:latest"
      - "--build-arg"
      - "BACKEND_URL=${_BACKEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_BACKEND_URL}"
      - "-f"
      - "frontend/Dockerfile"
      - "."

  # Backend → Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "--all-tags"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep"

  # Frontend → Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args:
      - "push"
      - "--all-tags"
      - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend"

  # Deploy backend to Cloud Run (asia-east2)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-backend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "osiris-imhotep"
      - "--project=$PROJECT_ID"
      - "--region=asia-east2"
      - "--image=asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
      - "--allow-unauthenticated"
      - "--max-instances=3"
      - "--min-instances=1"
      - "--timeout=300"
      - "--cpu=1"
      - "--memory=1Gi"
      - "--service-account=824525498687-compute@developer.gserviceaccount.com"
      - "--set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,SUPERADMIN_PASSWORD=superadmin-password:latest,DATABASE_URL=database-url:latest,GOOGLE_SERVICE_ACCOUNT_JSON=gdoc-sa-key:latest"
      - "--set-env-vars=GOOGLE_SERVICE_ACCOUNT_FILE=/tmp/app-data/osiris-sa.json,RAG_PROVIDER=sqlite_vec"
      - "--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=osiris-imhotep-main"
      - "--quiet"

  # Deploy frontend to Cloud Run (asia-east2)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-frontend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "osiris-frontend"
      - "--project=$PROJECT_ID"
      - "--region=asia-east2"
      - "--image=asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:${_TAG}"
      - "--allow-unauthenticated"
      - "--max-instances=3"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--set-env-vars=BACKEND_URL=https://osiris-imhotep-3fu6t5a3hq-df.a.run.app"
      - "--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=osiris-imhotep-main"
      - "--quiet"

images:
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:${_TAG}"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-imhotep:latest"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:${_TAG}"
  - "asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/osiris-imhotep/osiris-frontend:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: "CLOUD_LOGGING_ONLY"

substitutions:
  _BACKEND_URL: https://osiris-imhotep-3fu6t5a3hq-df.a.run.app
  _TAG: latest