# Frontend-only build - passes BACKEND_URL as a build-arg so next.config.js
# rewrites() bakes the real backend URL at build time.
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/osiris/frontend:${_TAG}"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/osiris/frontend:latest"
      - "--build-arg"
      - "BACKEND_URL=${_BACKEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_BACKEND_URL}"
      - "-f"
      - "frontend/Dockerfile"
      - "."

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/osiris/frontend:${_TAG}"

options:
  machineType: "E2_HIGHCPU_8"
  logging: "CLOUD_LOGGING_ONLY"
